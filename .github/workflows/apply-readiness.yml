name: Apply verified readiness source
on:
  push:
    branches: ['readiness/2026-09-06-tracking']
    paths: ['readiness-upload.b64', '.github/workflows/apply-readiness.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/readiness/2026-09-06-tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact payload and apply only named source files
        run: |
          python - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(Path('readiness-upload.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'b4988cec37ff202ccf36302bc5cbad2bbc826c7537f0bdbd7b344463ab63aaa6'
          payload = json.loads(raw)
          allowed = {'README.md', 'docs/AGENCY_WORKFLOW.md', 'examples/agency-intake.json', 'src/creator_link_kit/agency.py', 'tests/test_agency.py'}
          patch = payload['patch'].encode()
          stats = subprocess.check_output(['git','apply','--numstat','-'], input=patch).decode()
          changed = {line.split('\t')[-1] for line in stats.splitlines()}
          assert changed | set(payload['new_files']) == allowed
          assert not changed & set(payload['new_files'])
          for name in payload['new_files']:
              assert not Path(name).exists(), name
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          for name, content in payload['new_files'].items():
              Path(name).parent.mkdir(parents=True, exist_ok=True)
              Path(name).write_text(content, encoding='utf-8')
          PY
      - run: python -m pip install -e '.[dev]'
      - name: Normalize only the new Python modules
        run: |
          ruff check --select I --fix src/creator_link_kit/agency.py tests/test_agency.py
          ruff format src/creator_link_kit/agency.py tests/test_agency.py
      - name: Commit implementation and remove one-time application mechanism
        run: |
          git config user.name 'Tracking readiness'
          git config user.email '166657561+NeilFoxAgency@users.noreply.github.com'
          git add README.md docs/AGENCY_WORKFLOW.md examples/agency-intake.json src/creator_link_kit/agency.py tests/test_agency.py
          git rm readiness-upload.b64 .github/workflows/apply-readiness.yml
          git commit -m 'feat: add governed agency placement planning and audited connector handoff'
          git push origin HEAD:readiness/2026-09-06-tracking
          git rev-parse HEAD
      - name: Full tests, lint and build
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src
          ruff check src tests
          ruff format --check src tests
          python -m build
      - name: Export exact committed source
        if: always()
        run: git archive --format=tar.gz --output=reviewed-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-readiness-source
          path: reviewed-source.tar.gz
          retention-days: 3
