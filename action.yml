name: "Creator Link Kit Audit"
description: "Audit creator campaign links against a convention-as-code file using clk"
author: "Neil Fox Agency"

branding:
  icon: "link"
  color: "blue"

inputs:
  config:
    description: "Path to the convention JSON/YAML file"
    required: true
  input:
    description: "Path to the CSV or text file of links to audit"
    required: true
  url-column:
    description: "CSV column that holds the URL (optional; auto-detected when possible)"
    required: false
    default: ""
  format:
    description: "Report format: text, json, csv, or html"
    required: false
    default: "text"
  strict:
    description: "Treat warnings as errors (true/false)"
    required: false
    default: "false"
  python-version:
    description: "Python version used to run clk"
    required: false
    default: "3.12"
  version:
    description: "creator-link-kit version to install (empty = latest from PyPI, or 'local' to install from this repository)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install creator-link-kit
      shell: bash
      env:
        CLK_ACTION_PATH: ${{ github.action_path }}
        CLK_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ "$CLK_VERSION" = "local" ]; then
          python -m pip install -e "$CLK_ACTION_PATH"
        elif [ -n "$CLK_VERSION" ]; then
          python -m pip install "creator-link-kit==$CLK_VERSION"
        else
          # Prefer the action's own tree when the action is checked out from
          # this repository; otherwise install the published package.
          if [ -f "$CLK_ACTION_PATH/pyproject.toml" ]; then
            python -m pip install -e "$CLK_ACTION_PATH"
          else
            python -m pip install creator-link-kit
          fi
        fi

    - name: Run clk audit
      shell: bash
      env:
        CLK_CONFIG: ${{ inputs.config }}
        CLK_INPUT: ${{ inputs.input }}
        CLK_URL_COLUMN: ${{ inputs.url-column }}
        CLK_FORMAT: ${{ inputs.format }}
        CLK_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        JSON_OUT="$(mktemp)"
        trap 'rm -f "$JSON_OUT"' EXIT

        # Always capture structured JSON for the job summary (by_code totals).
        JSON_ARGS=(audit --config "$CLK_CONFIG" --input "$CLK_INPUT" --format json --out "$JSON_OUT")
        if [ -n "$CLK_URL_COLUMN" ]; then
          JSON_ARGS+=(--url-column "$CLK_URL_COLUMN")
        fi
        if [ "$CLK_STRICT" = "true" ]; then
          JSON_ARGS+=(--strict)
        fi

        set +e
        clk "${JSON_ARGS[@]}"
        EXIT_CODE=$?
        set -e

        # Publish a compact by-rule-code table to the Actions job summary.
        if [ -f "$JSON_OUT" ] && [ -s "$JSON_OUT" ]; then
          python - "$JSON_OUT" <<'PY'
        import json
        import os
        import sys

        path = sys.argv[1]
        with open(path, encoding="utf-8") as handle:
            data = json.load(handle)

        checked = data.get("checked", 0)
        clean = data.get("clean", 0)
        errors = data.get("errors", 0)
        warnings = data.get("warnings", 0)
        by_code = data.get("by_code") or {}

        lines = [
            "## Creator Link Kit audit",
            "",
            f"{checked} links checked: **{clean}** clean, **{errors}** error(s), **{warnings}** warning(s)",
            "",
        ]
        if by_code:
            lines.extend(
                [
                    "### By rule code",
                    "",
                    "| Code | Errors | Warnings |",
                    "| --- | ---: | ---: |",
                ]
            )
            # Sort by total issues descending, then code name.
            rows = sorted(
                by_code.items(),
                key=lambda item: (-(item[1].get("errors", 0) + item[1].get("warnings", 0)), item[0]),
            )
            for code, counts in rows:
                lines.append(
                    f"| `{code}` | {counts.get('errors', 0)} | {counts.get('warnings', 0)} |"
                )
            lines.append("")
        else:
            lines.append("No issues found.")
            lines.append("")

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(lines))
                handle.write("\n")
        else:
            # Local or non-Actions runs still print the summary block.
            print("\n".join(lines), file=sys.stderr)
        PY
        fi

        # Emit the operator-selected format to the step log (and preserve exit).
        DISPLAY_ARGS=(audit --config "$CLK_CONFIG" --input "$CLK_INPUT" --format "$CLK_FORMAT")
        if [ -n "$CLK_URL_COLUMN" ]; then
          DISPLAY_ARGS+=(--url-column "$CLK_URL_COLUMN")
        fi
        if [ "$CLK_STRICT" = "true" ]; then
          DISPLAY_ARGS+=(--strict)
        fi
        set +e
        clk "${DISPLAY_ARGS[@]}"
        DISPLAY_EXIT=$?
        set -e

        # Prefer the first audit's exit code (same inputs → same result).
        exit "$EXIT_CODE"
